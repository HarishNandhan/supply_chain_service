supply_chain_dbt:            # must match dbt_project.yml: `profile: supply_chain_dbt`
  target: dev
  outputs:
    dev:
      type: bigquery
      method: oauth          # or 'service-account' with keyfile
      project: "{{ env_var('BIGQUERY_PROJECT') }}"
      dataset: "{{ env_var('BIGQUERY_DATASET') }}"
      location: US
      threads: 4
